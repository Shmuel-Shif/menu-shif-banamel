<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>תפריט</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        position: relative;
        overflow: hidden;
      }

      .bg-logo {
        position: fixed;
        inset: 0;
        background: url("./logo.png") center center / 55vmin no-repeat;
        opacity: 0.1;
        filter: blur(5px);
        z-index: 0;
        pointer-events: none;
      }

      .top-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        margin: 6px 0 10px;
        border-radius: 50%;
        z-index: 1;
      }

      .menu-img {
        width: min(100%, 460px);
        height: auto;
        border-radius: 12px;
        margin-bottom: 12px;
        display: block;
        z-index: 1;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="bg-logo" aria-hidden="true"></div>

    <main class="wrap">
      <img class="top-logo" src="./logo.png" alt="לוגו" />
      <img class="menu-img" src="./menu.png" alt="תפריט עמוד ראשון" />
      <img class="menu-img" src="./menu2.png" alt="תפריט עמוד שני" />
    </main>
  </body>
</html>
